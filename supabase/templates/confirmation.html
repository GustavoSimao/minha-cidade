<!doctype html>
<html>
  <body style="font-family: system-ui, sans-serif; color: #1f2937;">
    <h2>Confirme seu e-mail</h2>
    <p>
      Falta pouco: confirme seu endereço de e-mail para concluir o cadastro no
      Minha Cidade e poder publicar, comentar e interagir.
    </p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=signup"
        style="display: inline-block; padding: 10px 18px; background: #16a34a; color: #fff; text-decoration: none; border-radius: 8px;"
      >
        Confirmar meu e-mail
      </a>
    </p>
    <p style="color: #6b7280; font-size: 14px;">
      Se você não criou uma conta no Minha Cidade, ignore este e-mail.
    </p>
  </body>
</html>
